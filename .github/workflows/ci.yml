name: CI
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04-arm
    env:
      POSTGRES_PASSWORD: ci-only-not-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt pytest httpx
      - run: cd backend && python -m pytest -q
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d postgres redis
      - run: docker compose run --rm backend alembic upgrade head
      - run: docker compose run --rm backend alembic current
      - run: docker compose up -d
      - run: bash scripts/check-health.sh
      - if: always()
        run: docker compose down -v
